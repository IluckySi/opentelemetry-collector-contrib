# Minimal local distro for SGCC ARMS receiver联调.
# Avoids full otelcontribcol (Datadog etc. need Go >= 1.26.9).

dist:
  module: github.com/open-telemetry/opentelemetry-collector-contrib/cmd/otelarmscol
  name: otelarmscol
  description: Local ARMS OpenAPI traces collector (SGCC联调)
  version: 0.165.1-dev
  output_path: ./cmd/otelarmscol

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.165.1-0.20261112225459-4888f0b280f9
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/alibabacloudarmsreceiver v0.165.1

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.165.1-0.20261112225459-4888f0b280f9
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.165.1-0.20261112225459-4888f0b280f9

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.165.1-0.20261112225459-4888f0b280f9
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.165.1-0.20261112225459-4888f0b280f9

extensions:
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.165.1-0.20261112225459-4888f0b280f9

replaces:
  - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/alibabacloudarmsreceiver => ../../receiver/alibabacloudarmsreceiver
